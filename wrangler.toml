# Cloudflare Pages config (see README → Deploy).
name = "resumechef"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"

# R2 bucket holding the BusyTeX engine under the "busytex/" prefix (upload tex-assets/busytex/*).
[[r2_buckets]]
binding = "TEX_ASSETS"
bucket_name = "resumechef-tex"
