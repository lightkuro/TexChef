<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="TexChef: edit LaTeX easily, all in the browser. Compile, preview and edit right on the PDF, and keep tailored versions of a master document, from resumes to papers." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:title" content="TexChef" />
    <meta property="og:description" content="Edit LaTeX easily, all in the browser: edit on the PDF, Visual mode, and tailored versions of one master document." />
    <meta property="og:image" content="/logo-512.png" />
    <title>TexChef</title>
    <script>
      // Apply mode and color theme before the app loads, to avoid a flash.
      try {
        const t = localStorage.getItem('rc-theme');
        const dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
        // Forest (green) is the default; Kitchen is the base styles with no attribute.
        const p = localStorage.getItem('rc-palette-v2') || 'forest';
        if (p !== 'kitchen') document.documentElement.dataset.palette = p;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
